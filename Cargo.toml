[package]
name = "fm"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
chrono = "0.4"
rust-embed = "8"
unicode-segmentation = "1"
smol = "2"
trash = "5"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# preview loaders (preview_content.rs)
imagesize = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
xz2 = "0.1"
bzip2 = "0.5"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# xattr 0.2.3 (pulled in by gpui_http_client) references libc::ENOATTR, which newer libc
# dropped on Linux. vendor/xattr is that release with the constant mapped to ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
